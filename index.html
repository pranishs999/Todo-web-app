<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamTodo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <!-- Auth Screen -->
  <div id="auth-screen" class="flex items-center justify-center min-h-screen bg-zinc-950">
    <div class="glass w-full max-w-md mx-4 rounded-3xl p-10">
      <h1 class="text-3xl font-bold text-center mb-8">TeamTodo</h1>
      <div class="flex border-b border-zinc-700 mb-6">
        <button onclick="switchTab(0)" id="login-tab" class="flex-1 py-3 font-medium border-b-2 border-blue-500">Login</button>
        <button onclick="switchTab(1)" id="register-tab" class="flex-1 py-3 font-medium text-zinc-400">Register</button>
      </div>
      <div id="global-error" class="hidden mb-4 p-4 bg-red-500/10 border border-red-500 rounded-2xl text-red-400 text-sm"></div>

      <div id="login-form">
        <input id="login-id" type="text" placeholder="Email or Username" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4">
        <div class="relative mb-6">
          <input id="login-pass" type="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4" oninput="liveValidatePassword(this)">
          <button type="button" onclick="togglePassword('login-pass')" class="absolute right-5 top-5 text-zinc-400"><i id="login-pass-icon" class="fas fa-eye"></i></button>
        </div>
        <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl font-medium">Login</button>
      </div>

      <div id="register-form" class="hidden">
        <input id="reg-name" placeholder="Full Name" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4" oninput="liveValidateName(this)">
        <input id="reg-user" placeholder="Username" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4">
        <input id="reg-email" type="email" placeholder="Email" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4" oninput="liveValidateEmail(this)">
        <div class="relative mb-6">
          <input id="reg-pass" type="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4" oninput="liveValidatePassword(this)">
          <button type="button" onclick="togglePassword('reg-pass')" class="absolute right-5 top-5 text-zinc-400"><i id="reg-pass-icon" class="fas fa-eye"></i></button>
        </div>
        <button onclick="register()" class="w-full bg-blue-600 py-4 rounded-2xl font-medium">Register</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="main-app" class="hidden flex h-screen">
    <div class="w-64 bg-zinc-900 border-r border-zinc-800 p-5 flex flex-col">
      <div class="flex items-center gap-2 mb-10">
        <div class="w-8 h-8 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold">TT</div>
        <h1 class="text-2xl font-semibold">TeamTodo</h1>
      </div>
      <div class="glass rounded-3xl p-4 mb-8">
        <div class="flex items-center gap-3">
          <div id="profile-avatar" class="w-11 h-11 bg-gradient-to-br from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center text-white text-xl">👤</div>
          <div>
            <p id="profile-name" class="font-semibold"></p>
            <p id="profile-role" class="text-xs text-emerald-400"></p>
          </div>
        </div>
      </div>
      <nav class="space-y-1">
        <button onclick="showSection('kanban')" class="flex items-center gap-3 w-full p-3 rounded-2xl hover:bg-zinc-800">📋 Kanban</button>
        <button onclick="showSection('dashboard')" class="flex items-center gap-3 w-full p-3 rounded-2xl hover:bg-zinc-800">📊 Dashboard</button>
        <button id="nav-users" onclick="showSection('users')" class="hidden items-center gap-3 w-full p-3 rounded-2xl hover:bg-zinc-800">👥 Users</button>
        <button onclick="logout()" class="flex items-center gap-3 w-full p-3 rounded-2xl hover:bg-red-500/10 text-red-400 mt-auto">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </nav>
    </div>

    <div class="flex-1 flex flex-col">
      <header class="h-14 bg-zinc-900 border-b border-zinc-800 px-6 flex items-center gap-4">
        <input id="search-input" onkeyup="filterTasks()" placeholder="Search tasks..." class="bg-zinc-800 border border-zinc-700 rounded-3xl px-5 py-2 w-80 focus:outline-none focus:border-blue-500">
        <select id="status-filter" onchange="filterTasks()" class="bg-zinc-800 border border-zinc-700 rounded-3xl px-4 py-2">
          <option value="">All Status</option>
          <option value="Todo">Todo</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="priority-filter" onchange="filterTasks()" class="bg-zinc-800 border border-zinc-700 rounded-3xl px-4 py-2">
          <option value="">All Priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <button onclick="exportToPDF()" class="ml-auto flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-2xl text-sm">
          <i class="fas fa-file-pdf"></i> Export PDF
        </button>
      </header>

      <div id="section-kanban" class="flex-1 overflow-auto p-6">
        <div class="flex gap-6 overflow-x-auto pb-10">
          <div class="flex-1 min-w-[320px]">
            <h3 class="text-zinc-400 mb-4 font-medium flex items-center justify-between">📋 Todo <span id="todo-count" class="text-xs bg-zinc-800 px-2 py-1 rounded-lg">0</span></h3>
            <div id="todo-col" class="column glass p-3 rounded-3xl min-h-[70vh]"></div>
          </div>
          <div class="flex-1 min-w-[320px]">
            <h3 class="text-zinc-400 mb-4 font-medium flex items-center justify-between">🚀 In Progress <span id="progress-count" class="text-xs bg-zinc-800 px-2 py-1 rounded-lg">0</span></h3>
            <div id="progress-col" class="column glass p-3 rounded-3xl min-h-[70vh]"></div>
          </div>
          <div class="flex-1 min-w-[320px]">
            <h3 class="text-zinc-400 mb-4 font-medium flex items-center justify-between">✅ Completed <span id="completed-count" class="text-xs bg-zinc-800 px-2 py-1 rounded-lg">0</span></h3>
            <div id="completed-col" class="column glass p-3 rounded-3xl min-h-[70vh]"></div>
          </div>
        </div>
      </div>

      <div id="section-dashboard" class="hidden flex-1 overflow-auto p-10">
        <h2 class="text-3xl font-bold mb-10">System Dashboard</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
          <div class="glass p-8 rounded-3xl border-l-4 border-blue-500">
            <p class="text-zinc-400 text-sm mb-2">Total Tasks</p>
            <p id="stat-total" class="text-4xl font-bold">0</p>
          </div>
          <div class="glass p-8 rounded-3xl border-l-4 border-amber-500">
            <p class="text-zinc-400 text-sm mb-2">Pending</p>
            <p id="stat-todo" class="text-4xl font-bold">0</p>
          </div>
          <div class="glass p-8 rounded-3xl border-l-4 border-purple-500">
            <p class="text-zinc-400 text-sm mb-2">In Progress</p>
            <p id="stat-progress" class="text-4xl font-bold">0</p>
          </div>
          <div class="glass p-8 rounded-3xl border-l-4 border-emerald-500">
            <p class="text-zinc-400 text-sm mb-2">Completed</p>
            <p id="stat-completed" class="text-4xl font-bold">0</p>
          </div>
        </div>
        <div class="glass p-10 rounded-3xl">
          <h3 class="text-xl font-semibold mb-6">Recent Activity</h3>
          <div id="recent-activity" class="space-y-4"></div>
        </div>
      </div>

      <div id="section-users" class="hidden flex-1 overflow-auto p-10">
        <h2 class="text-3xl font-bold mb-10">Team Management</h2>
        <div class="glass rounded-3xl overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-zinc-900/50">
              <tr>
                <th class="p-5 font-semibold text-zinc-400">User</th>
                <th class="p-5 font-semibold text-zinc-400">Username</th>
                <th class="p-5 font-semibold text-zinc-400">Email</th>
                <th class="p-5 font-semibold text-zinc-400">Role</th>
                <th class="p-5 font-semibold text-zinc-400 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Task Modal -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="glass w-full max-w-lg mx-4 rounded-3xl p-8">
      <h2 id="modal-title" class="text-2xl font-semibold mb-6">New Task</h2>
      <input id="task-title" placeholder="Task title" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-4">
      <textarea id="task-desc" rows="3" placeholder="Description" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 mb-6"></textarea>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="text-xs text-zinc-400 mb-1">Priority</label>
          <select id="task-priority" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-zinc-400 mb-1">Assignee</label>
          <select id="task-assignee" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
            <option value="">Unassigned</option>
          </select>
        </div>
      </div>
      <div class="mb-6">
        <label class="text-xs text-zinc-400 mb-1">Due Date</label>
        <input type="date" id="task-due" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
      </div>
      <div class="flex gap-3">
        <button onclick="hideModal()" class="flex-1 py-4 border border-zinc-700 rounded-2xl">Cancel</button>
        <button onclick="saveTask()" id="save-btn" class="flex-1 py-4 bg-blue-600 rounded-2xl">Create Task</button>
      </div>
    </div>
  </div>

  <button onclick="showCreateModal()" class="fixed bottom-8 right-8 w-16 h-16 bg-blue-600 hover:bg-blue-500 rounded-3xl text-4xl shadow-2xl flex items-center justify-center">+</button>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = null;
    let socket;
    let allTasks = [];
    let allUsers = [];
    let editingTaskId = null;

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      return Math.floor(seconds / 86400) + 'd ago';
    }

    function switchTab(n) {
      document.getElementById('login-form').classList.toggle('hidden', n === 1);
      document.getElementById('register-form').classList.toggle('hidden', n === 0);
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = document.getElementById(id + '-icon');
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = "password";
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function liveValidateEmail(input) {
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const error = document.getElementById(input.id + '-error') || { classList: { add: () => {}, remove: () => {} } };
      if (!input.value.trim() || !regex.test(input.value)) {
        input.classList.add('border-red-500');
      } else {
        input.classList.remove('border-red-500');
      }
    }

    function liveValidatePassword(input) {
      if (input.value.length < 6) input.classList.add('border-red-500');
      else input.classList.remove('border-red-500');
    }

    function liveValidateName(input) {
      if (input.value.trim().length < 2) input.classList.add('border-red-500');
      else input.classList.remove('border-red-500');
    }

    async function login() {
      const identifier = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pass').value;
      if (!identifier || !password) return showGlobalError("All fields required");
 
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg);
        handleAuthSuccess(data);
      } catch (err) {
        showGlobalError(err.message);
      }
    }

    async function register() {
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-user').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pass').value;
      if (!name || !username || !email || !password) return showGlobalError("All fields required");
 
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg);
        handleAuthSuccess(data);
      } catch (err) {
        showGlobalError(err.message);
      }
    }

    function showGlobalError(msg) {
      const el = document.getElementById('global-error');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function handleAuthSuccess(data) {
      token = data.token;
      currentUser = data.user;
      localStorage.setItem('token', token);
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('profile-name').textContent = currentUser.name;
      document.getElementById('profile-role').textContent = currentUser.role;
      if (currentUser.role === 'Admin') document.getElementById('nav-users').classList.replace('hidden', 'flex');
      connectSocket();
      loadTasks();
      loadUsers();
      updateDashboard();
    }

    function connectSocket() {
      socket = io();
      socket.on('taskCreated', () => loadTasks());
      socket.on('taskUpdated', () => loadTasks());
      socket.on('taskDeleted', () => loadTasks());
    }

    async function loadTasks() {
      const res = await fetch('/api/tasks', {
        headers: { Authorization: `Bearer ${token}` }
      });
      allTasks = await res.json();
      filterTasks();
      updateDashboard();
    }

    async function loadUsers() {
      if (currentUser.role !== 'Admin') return;
      const res = await fetch('/api/admin/users', {
        headers: { Authorization: `Bearer ${token}` }
      });
      allUsers = await res.json();
      const select = document.getElementById('task-assignee');
      select.innerHTML = '<option value="">Unassigned</option>';
      allUsers.forEach(u => select.innerHTML += `<option value="${u._id}">${u.name}</option>`);
      renderUsersTable();
    }

    async function updateDashboard() {
      const res = await fetch('/api/stats', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const stats = await res.json();
      document.getElementById('stat-total').textContent = stats.Total;
      document.getElementById('stat-todo').textContent = stats.Todo;
      document.getElementById('stat-progress').textContent = stats['In Progress'];
      document.getElementById('stat-completed').textContent = stats.Completed;

      const activity = document.getElementById('recent-activity');
      activity.innerHTML = '';
      allTasks.slice(0, 5).forEach(t => {
        activity.innerHTML += `
          <div class="flex items-center justify-between p-4 bg-zinc-900/50 rounded-2xl">
            <div class="flex items-center gap-3">
              <div class="w-2 h-2 rounded-full ${t.status === 'Completed' ? 'bg-emerald-500' : 'bg-blue-500'}"></div>
              <span>${t.title}</span>
            </div>
            <span class="text-xs text-zinc-500">${timeAgo(t.updatedAt)}</span>
          </div>
        `;
      });
    }

    function filterTasks() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const status = document.getElementById('status-filter').value;
      const priority = document.getElementById('priority-filter').value;

      let filtered = allTasks;

      if (search) {
        filtered = filtered.filter(t => t.title.toLowerCase().includes(search) || (t.description && t.description.toLowerCase().includes(search)));
      }
      if (status) filtered = filtered.filter(t => t.status === status);
      if (priority) filtered = filtered.filter(t => t.priority === priority);

      renderKanban(filtered);
    }

    function renderKanban(tasks) {
      const cols = {
        todo: document.getElementById('todo-col'),
        progress: document.getElementById('progress-col'),
        completed: document.getElementById('completed-col')
      };
      document.getElementById('todo-count').textContent = tasks.filter(t => t.status === 'Todo').length;
      document.getElementById('progress-count').textContent = tasks.filter(t => t.status === 'In Progress').length;
      document.getElementById('completed-count').textContent = tasks.filter(t => t.status === 'Completed').length;

      tasks.forEach(task => {
        const key = (task.status || 'Todo').toLowerCase().replace(' ', '');
        const col = cols[key] || cols.todo;
        const card = document.createElement('div');
        card.draggable = true;
        card.dataset.id = task._id;
        card.ondragstart = (e) => e.dataTransfer.setData("taskId", task._id);
        const isOwner = task.createdBy === currentUser.id || currentUser.role === 'Admin';
        const assignee = allUsers.find(u => u._id === task.assignedTo);
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${task.status === 'Completed' ? 'checked' : ''} onchange="toggleStatus('${task._id}', '${task.status}')" class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-blue-600 focus:ring-0">
              <div class="font-medium ${task.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${task.title}</div>
            </div>
            ${isOwner ? `
              <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="editTask('${task._id}')" class="text-zinc-400 hover:text-blue-400"><i class="fas fa-pencil-alt text-xs"></i></button>
                <button onclick="deleteTask('${task._id}')" class="text-zinc-400 hover:text-red-400"><i class="fas fa-trash text-xs"></i></button>
              </div>
            ` : ''}
          </div>
          ${task.description ? `<div class="text-xs text-zinc-400 mt-2 ml-6">${task.description}</div>` : ''}
          <div class="flex items-center justify-between mt-4 ml-6">
            <div class="flex items-center gap-3">
              <span class="px-2 py-0.5 rounded-lg text-[10px] uppercase font-bold ${task.priority === 'High' ? 'bg-red-500/10 text-red-400' : 'bg-amber-500/10 text-amber-400'}">${task.priority}</span>
              <span class="text-[10px] text-zinc-500"><i class="far fa-clock mr-1"></i>${timeAgo(task.createdAt)}</span>
            </div>
            ${assignee ? `<div title="${assignee.name}" class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-[10px] font-bold text-white">${assignee.name[0]}</div>` : ''}
          </div>
        `;
        card.className = `task-card group glass p-5 rounded-3xl mb-3 cursor-grab border border-transparent hover:border-zinc-700 transition-all`;
        col.appendChild(card);
      });
    }

    function showCreateModal() {
      editingTaskId = null;
      document.getElementById('modal-title').textContent = 'New Task';
      document.getElementById('save-btn').textContent = 'Create Task';
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-priority').value = 'Medium';
      document.getElementById('task-assignee').value = '';
      document.getElementById('task-due').value = '';
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    async function saveTask() {
      const title = document.getElementById('task-title').value.trim();
      if (!title) return alert("Title required");
 
      const payload = {
        title,
        description: document.getElementById('task-desc').value.trim(),
        priority: document.getElementById('task-priority').value,
        assignedTo: document.getElementById('task-assignee').value || null,
        dueDate: document.getElementById('task-due').value || null
      };

      try {
        const url = editingTaskId ? `/api/tasks/${editingTaskId}` : '/api/tasks';
        const method = editingTaskId ? 'PUT' : 'POST';
        
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("Failed to save task");
        hideModal();
        loadTasks();
      } catch (e) {
        alert(e.message);
      }
    }

    async function toggleStatus(id, currentStatus) {
      const statuses = ['Todo', 'In Progress', 'Completed'];
      let nextIndex = (statuses.indexOf(currentStatus) + 1) % statuses.length;
      const nextStatus = statuses[nextIndex];

      try {
        await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ status: nextStatus })
        });
        loadTasks();
      } catch (e) {
        alert("Failed to update status");
      }
    }

    async function editTask(id) {
      const task = allTasks.find(t => t._id === id);
      if (!task) return;
      editingTaskId = id;
      document.getElementById('modal-title').textContent = 'Edit Task';
      document.getElementById('save-btn').textContent = 'Save Changes';
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-desc').value = task.description || '';
      document.getElementById('task-priority').value = task.priority;
      document.getElementById('task-assignee').value = task.assignedTo || '';
      document.getElementById('task-due').value = task.dueDate ? new Date(task.dueDate).toISOString().split('T')[0] : '';
      document.getElementById('task-modal').classList.remove('hidden');
    }

    async function deleteTask(id) {
      if (!confirm("Are you sure you want to delete this task?")) return;
      try {
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Delete failed");
        loadTasks();
      } catch (e) {
        alert(e.message);
      }
    }

    async function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(20);
      doc.text("TeamTodo Report", 20, 20);
      doc.setFontSize(12);
      doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 30);
      let y = 50;
      allTasks.forEach((task, i) => {
        doc.text(`${i+1}. ${task.title} - ${task.status} - ${task.priority}`, 20, y);
        y += 10;
      });
      doc.save("TeamTodo_Report.pdf");
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      location.reload();
    }
 
    function showSection(id) {
      document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
      document.getElementById('section-' + id).classList.remove('hidden');
      if (id === 'dashboard') updateDashboard();
      if (id === 'users') loadUsers();
    }

    function renderUsersTable() {
      const body = document.getElementById('users-table-body');
      body.innerHTML = '';
      allUsers.forEach(u => {
        body.innerHTML += `
          <tr class="border-b border-zinc-800 hover:bg-zinc-800/30">
            <td class="p-5">${u.name} ${u._id === currentUser.id ? '(You)' : ''}</td>
            <td class="p-5 text-zinc-400">${u.username}</td>
            <td class="p-5 text-zinc-400">${u.email}</td>
            <td class="p-5">
              <span class="px-3 py-1 rounded-full text-[10px] ${u.role === 'Admin' ? 'bg-purple-500/20 text-purple-400' : 'bg-blue-500/20 text-blue-400'}">${u.role}</span>
            </td>
            <td class="p-5 text-right">
              ${u._id !== currentUser.id ? `<button onclick="deleteUser('${u._id}')" class="text-red-400 hover:text-red-300"><i class="fas fa-user-minus"></i></button>` : ''}
            </td>
          </tr>
        `;
      });
    }

    async function deleteUser(id) {
      if (!confirm("Remove this user?")) return;
      await fetch(`/api/admin/users/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      });
      loadUsers();
    }

    // Auto Login
    if (token) {
      currentUser = { name: "You", role: "Admin" };
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('profile-name').textContent = currentUser.name;
      document.getElementById('profile-role').textContent = currentUser.role;
      connectSocket();
      loadTasks();
    }
  </script>
</body>
</html>
